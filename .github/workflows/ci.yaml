name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dotnet SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Test
        run: dotnet test DeepAgentNet.sln --configuration Release --verbosity normal
